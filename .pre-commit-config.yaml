# Pre-commit configuration for SmartHealth
# Ensures code quality, type safety, and formatting before commits
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1024']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        args: [--explicit-package-bases, backend/app]
        additional_dependencies:
          - types-python-jose
          - pydantic
          - fastapi

  - repo: local
    hooks:
      - id: frontend-lint
        name: Frontend ESLint
        entry: bash -c "cd frontend && npm run lint"
        language: system
        files: ^frontend/.*\.tsx?$
        pass_filenames: false

      - id: frontend-typecheck
        name: Frontend Typecheck
        entry: bash -c "cd frontend && npx tsc -b"
        language: system
        files: ^frontend/.*\.tsx?$
        pass_filenames: false
